{% extends "template.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/normalDist.css') }}">
<div class="container">
    <div class="chart-container">
        <canvas id="normaldist"></canvas>
    </div>
    <div class="parameters">
        <h3>Edit distribution parameters:</h3>
        <div class="mu">
            <label for="mu-slider">μ (mean)</label>
            <input
                type="range"
                id="mu-slider"
                min="-5"
                max="5"
                step="0.1"
                value="0"
            >
            <span id="mu-value">0</span>
        </div>
        <div class="sigma">
            <label for="sigma-slider">σ (standard deviation)</label>
            <input
                type="range"
                id="sigma-slider"
                min="0.1"
                max="5"
                step="0.1"
                value="1"
            >
            <span id="sigma-value">1</span>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/lib/chart.umd.js') }}"></script>
<script src="{{ url_for('static', filename='js/normalDist.js') }}"></script>
{% endblock %}
